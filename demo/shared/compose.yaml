services:
  # Native NGINX routing and HTTP observability
  nginx:
    image: nginx:1.31.6-alpine-otel@sha256:f237a3efb7233a400a89c2bbb16c68dc4036de731c143a2a87160b3c9238f0b3
    ports:
      - "${MCP_PORT:-9000}:9000"
    volumes:
      - ./native-routing/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/snippets:/etc/nginx/mcp:ro
      - ./shared:/etc/nginx/demo:ro
    depends_on:
      - mcp-information
      - mcp-operations
      - mcp-data
      - otel-collector
    networks:
      - mcp-network

  # OpenTelemetry Collector with spanmetrics connector
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.146.1
    volumes:
      - ./shared/otel.yaml:/etc/otelcol-contrib/config.yaml:ro
      - ../observability/otel:/etc/otelcol-contrib/pipelines:ro
    command:
      - --config=/etc/otelcol-contrib/config.yaml
      - --config=/etc/otelcol-contrib/pipelines/edge.yaml
    networks:
      - mcp-network

  # Prometheus for metrics storage
  prometheus:
    image: prom/prometheus:v3.9.1
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./shared/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      - otel-collector
    networks:
      - mcp-network

  # Grafana for visualization
  grafana:
    image: grafana/grafana-oss:12.3.3
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_LOG_LEVEL=warn
      - GF_PLUGINS_PREINSTALL_DISABLED=true
    volumes:
      - ./shared/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./shared/grafana/providers.yaml:/etc/grafana/provisioning/dashboards/providers.yaml:ro
      - ../observability/grafana/http:/var/lib/grafana/http:ro
    depends_on:
      - prometheus
    networks:
      - mcp-network

  # MCP Server: information tools
  mcp-information:
    image: mcp-demo:2026-07-28
    build:
      context: ./shared/backends/go
      args:
        BUILDER_IMAGE: ${MCP_BUILDER_IMAGE:-golang:1.25.9-alpine3.23@sha256:5caaf1cca9dc351e13deafbc3879fd4754801acba8653fa9540cea125d01a71f}
    command:
      - "/mcp_server"
      - "--name"
      - "mcp-information"
      - "--backend"
      - "information"
      - "--port"
      - "9001"
      - "--allow-simulation"
    networks:
      - mcp-network

  # MCP Server: operations tools with elevated latency
  mcp-operations:
    image: mcp-demo:2026-07-28
    command:
      - "/mcp_server"
      - "--name"
      - "mcp-operations"
      - "--backend"
      - "operations"
      - "--port"
      - "9002"
      - "--max-latency"
      - "100ms"
      - "--allow-simulation"
    networks:
      - mcp-network

  # MCP Server: data tools
  mcp-data:
    image: mcp-demo:2026-07-28
    command:
      - "/mcp_server"
      - "--name"
      - "mcp-data"
      - "--backend"
      - "data"
      - "--port"
      - "9003"
      - "--allow-simulation"
    networks:
      - mcp-network

  # MCP Client: traffic generator
  mcp-client:
    image: mcp-demo:2026-07-28
    restart: unless-stopped
    command:
      - "/mcp_client"
      - "-url"
      - "http://nginx:9000/mcp"
      - "-duration"
      - "${MCP_LOAD_DURATION:-24h}"
      - "-workers"
      - "6"
      - "-rps"
      - "${MCP_LOAD_RPS:-40}"
      - "-tool-error-percent"
      - "${MCP_TOOL_ERROR_PERCENT:-10}"
      - "-rpc-error-percent"
      - "${MCP_RPC_ERROR_PERCENT:-5}"
      - "-header-error-percent"
      - "${MCP_HEADER_ERROR_PERCENT:-5}"
      - "-policy-denial-percent"
      - "${MCP_POLICY_DENIAL_PERCENT:-5}"
      - "-input-required-percent"
      - "${MCP_INPUT_REQUIRED_PERCENT:-5}"
    depends_on:
      - nginx
    networks:
      - mcp-network

networks:
  mcp-network:
    driver: bridge
