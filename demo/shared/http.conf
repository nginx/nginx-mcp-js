include /etc/nginx/mcp/mcp-metadata.conf;
include /etc/nginx/demo/routes.conf;
include /etc/nginx/demo/upstreams.conf;

log_format mcp_http '$request_method $uri $status '
                    'tool=$mcp_body_tool upstream=$upstream_status';
access_log /dev/stdout mcp_http;

otel_service_name nginx-mcp-edge;
otel_exporter {
    endpoint otel-collector:4317;
}
