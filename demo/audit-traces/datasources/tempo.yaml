apiVersion: 1

datasources:
  - name: Tempo
    type: tempo
    access: proxy
    url: http://audit-tempo:3200
    uid: mcp-audit-tempo
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: mcp-audit-loki
        spanStartTimeShift: -2s
        spanEndTimeShift: 2s
        customQuery: true
        query: '{service_name="nginx-mcp-edge"} | trace_id="$${__trace.traceId}"'
      nodeGraph:
        enabled: true
