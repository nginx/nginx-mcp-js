@MODULES@

worker_processes 2;
pid @STATE@/nginx.pid;
error_log @STATE@/logs/error.log info;

mgmt {
    license_token "@LICENSE@";
    usage_report endpoint=127.1.1.121;
    enforce_initial_report off;
}

events {
}

http {
    js_engine qjs;
    js_import policy from "@EXAMPLE@/policy.mjs";
    js_import observer from "@EXAMPLE@/../../njs/mcp-observer.mjs";

    include "@EXAMPLE@/../../nginx/snippets/mcp-metadata.conf";
    js_var $mcp_outcome unobserved;
    js_var $mcp_rpc_code;
    include "@EXAMPLE@/authorization.conf";
    include "@STATE@/telemetry.conf";
    include "@EXAMPLE@/audit.conf";

    map $mcp_body_tool $mcp_upstream {
        default        "";
        get_forecast   information;
        search_web     information;
        translate_text information;
    }

    upstream information {
        server @BACKEND@;
    }

    server {
        include "@EXAMPLE@/../../nginx/snippets/mcp-errors.conf";
        listen @PORT@ ssl;
        ssl_certificate "@STATE@/certs/server.crt";
        ssl_certificate_key "@STATE@/certs/server.key";
        client_body_early_read $mcp_read_body;
        client_max_body_size 64k;
        client_body_buffer_size 64k;
        client_body_in_single_buffer on;

        set $mcp_rejection_reason "";
        set $mcp_authn rejected;
        set $mcp_authz not_evaluated;
        set $mcp_subject "";
        set $mcp_tenant "";
        set $mcp_required_scope "";
        add_header X-Request-ID $request_id always;
        access_log "@STATE@/logs/mcp.json" mcp_oauth if=$mcp_is_request;

        include "@STATE@/tracing.conf";

        location = /mcp {
            js_header_filter policy.challenge;
            auth_jwt "MCP";
            auth_jwt_key_request /_jwks;
            auth_jwt_key_file "@STATE@/fixture-jwks.json";
            auth_jwt_key_cache 30s;
            auth_jwt_require $mcp_token_profile;
            internal_redirect @mcp_authenticated;
        }

        location @mcp_authenticated {
            js_header_filter policy.challenge;
            set $mcp_authn authenticated;
            set $mcp_subject $jwt_claim_sub;
            set $mcp_tenant $jwt_claim_tenant;
            set $mcp_required_scope $mcp_scope;
            set $mcp_authz denied;

            if ($mcp_scope_allowed = 0) {
                set $mcp_rejection_reason insufficient_scope;
                return 403;
            }

            include "@EXAMPLE@/../../nginx/snippets/mcp-validation.conf";
            set $mcp_authz allowed;
            proxy_set_header Authorization "";
            proxy_set_header X-User $mcp_subject;
            proxy_set_header X-Tenant $mcp_tenant;
            proxy_set_header X-Request-ID $request_id;
            proxy_pass http://information;
            js_body_filter observer.observe buffer_type=buffer;
        }

        location @mcp_method_not_allowed {
            add_header Allow POST always;
            add_header X-Request-ID $request_id always;
            return 405;
        }

        location = /_jwks {
            internal;
            proxy_method GET;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            subrequest_output_buffer_size 64k;
            proxy_pass
                http://@IDP@/idp/realms/mcp/protocol/openid-connect/certs;
        }

        location = /.well-known/oauth-protected-resource/mcp {
            default_type application/json;
            alias "@STATE@/protected-resource.json";
        }

        location /idp/ {
            proxy_set_header Host "@HOST@";
            proxy_set_header X-Forwarded-Host "@HOST@";
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port @PUBLIC_PORT@;
            proxy_pass http://@IDP@;
            access_log off;
        }

        location / {
            proxy_set_header Host "@HOST@";
            proxy_set_header X-Forwarded-Proto https;
            proxy_pass http://@APP@;
            access_log off;
        }
    }
}
