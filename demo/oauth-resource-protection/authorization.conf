map $uri $mcp_is_request {
    default 0;
    /mcp    1;
}

map $uri $mcp_read_body {
    default 0;
    /mcp    1;
}

map $mcp_body_tool $mcp_scope {
    default        mcp:tools;
    translate_text mcp:translate;
}

js_set $mcp_token_profile policy.profile;
js_set $mcp_scope_allowed policy.scopeAllowed;

map $http_authorization $mcp_token_reason {
    ""      missing_token;
    default invalid_token;
}

map "$status:$mcp_authn" $mcp_oauth_reason {
    "401:rejected" $mcp_token_reason;
    default        $mcp_rejection_reason;
}

map $upstream_addr $mcp_audit_upstream_attempted {
    ""      false;
    default true;
}

map $upstream_addr $mcp_audit_decision {
    ""      rejected;
    default forwarded;
}
