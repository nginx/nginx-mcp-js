load_module modules/ngx_http_js_module.so;
load_module modules/ngx_otel_module.so;

worker_processes 4;
error_log /dev/stderr info;

events {
}

http {
    js_engine qjs;
    include /etc/nginx/demo/http.conf;
    include /etc/nginx/mcp/mcp-njs.conf;
    include /etc/nginx/mcp/mcp-breaker.conf;

    map $mcp_upstream $mcp_breaker_key {
        ""      "";
        default "$mcp_upstream:$mcp_body_tool";
    }

    log_format mcp_breaker '$status tool=$mcp_body_tool '
                          'admission=$mcp_breaker_admission '
                          'outcome=$mcp_outcome upstream=$upstream_status'
                          '$mcp_breaker_record';

    server {
        listen 9000;
        include /etc/nginx/demo/mcp-server.conf;
        access_log /dev/stdout mcp_breaker;

        otel_span_attr "mcp.breaker.admission" $mcp_breaker_admission;
        otel_span_attr "mcp.outcome" $mcp_outcome;
        otel_span_attr "mcp.rpc.code" $mcp_rpc_code;

        location = /mcp {
            include /etc/nginx/demo/mcp-proxy.conf;
            if ($mcp_breaker_admission = blocked) {
                return 503 '{"error":"Tool temporarily unavailable"}';
            }
            add_header X-MCP-Upstream-Status $upstream_status always;
            add_header X-MCP-Worker $pid always;
            js_body_filter observer.observe buffer_type=buffer;
        }
    }
}
