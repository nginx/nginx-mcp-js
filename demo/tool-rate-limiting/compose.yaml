services:
  nginx:
    volumes:
      - ./tool-rate-limiting/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tool-rate-limiting:/etc/nginx/rate-limiting:ro
  otel-collector:
    command:
      - --config=/etc/otelcol-contrib/config.yaml
      - --config=/etc/otelcol-contrib/pipelines/edge.yaml
      - --config=/etc/otelcol-contrib/pipelines/rate-limit.yaml
  grafana:
    volumes:
      - ./tool-rate-limiting/providers.yaml:/etc/grafana/provisioning/dashboards/providers.yaml:ro
      - ../observability/grafana/rate-limit:/var/lib/grafana/rate-limit:ro
  mcp-client:
    command:
      - /mcp_client
      - -url
      - http://nginx:9000/mcp
      - -tool
      - get_forecast
      - -workers
      - "4"
      - -rps
      - "20"
      - -duration
      - 24h
      - -tool-error-percent
      - "0"
      - -rpc-error-percent
      - "0"
      - -header-error-percent
      - "0"
      - -policy-denial-percent
      - "0"
      - -input-required-percent
      - "0"
  mcp-client-steady:
    image: mcp-demo:2026-07-28
    restart: unless-stopped
    command:
      - /mcp_client
      - -url
      - http://nginx:9000/mcp
      - -tool
      - search_web
      - -workers
      - "1"
      - -rps
      - "2"
      - -duration
      - 24h
      - -tool-error-percent
      - "0"
      - -rpc-error-percent
      - "0"
      - -header-error-percent
      - "0"
      - -policy-denial-percent
      - "0"
      - -input-required-percent
      - "0"
    depends_on:
      - nginx
    networks:
      - mcp-network
