load_module modules/ngx_otel_module.so;

worker_processes auto;
error_log /dev/stderr info;

events {
}

http {
    include /etc/nginx/demo/http.conf;
    include /etc/nginx/rate-limiting/limits.conf;
    log_format mcp_limit '$status tool=$mcp_body_tool '
                         'limit=$limit_req_status upstream=$upstream_status';

    server {
        listen 9000;

        include /etc/nginx/demo/mcp-server.conf;
        access_log /dev/stdout mcp_limit;
        otel_span_attr "mcp.rate_limit.status" $limit_req_status;

        location = /mcp {
            include /etc/nginx/demo/mcp-proxy.conf;
            include /etc/nginx/mcp/mcp-rate-limit.conf;
            add_header X-MCP-Upstream-Status $upstream_status always;
        }

        location @mcp_rate_limited {
            default_type application/json;
            add_header X-MCP-Upstream-Status $upstream_status always;
            return 429 '{"error":"Tool rate limit exceeded"}';
        }
    }
}
