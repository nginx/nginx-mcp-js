load_module modules/ngx_http_js_module.so;
load_module modules/ngx_otel_module.so;

worker_processes auto;
error_log /dev/stderr info;

events {
}

http {
    js_engine qjs;

    include /etc/nginx/demo/http.conf;
    include /etc/nginx/mcp/mcp-njs.conf;
    include /etc/nginx/mcp/mcp-audit.conf;

    server {
        listen 9000;

        include /etc/nginx/mcp/mcp-body.conf;
        include /etc/nginx/mcp/mcp-otel.conf;

        access_log /dev/stdout mcp_audit;
        add_header X-Request-ID $request_id always;

        otel_span_attr "mcp.outcome" $mcp_outcome;
        otel_span_attr "mcp.rpc.code" $mcp_rpc_code;
        otel_span_attr "mcp.gateway.reason" $mcp_audit_reason;

        location @mcp_method_not_allowed {
            default_type application/json;
            add_header Allow POST always;
            add_header X-Request-ID $request_id always;
            return 405 '{"error":"HTTP method must be POST"}';
        }

        location = /mcp {
            include /etc/nginx/demo/mcp-proxy.conf;
            proxy_set_header X-Request-ID $request_id;
            js_body_filter observer.observe buffer_type=buffer;
        }
    }
}
