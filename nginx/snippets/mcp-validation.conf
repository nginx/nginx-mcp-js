default_type application/json;
error_page 405 = @mcp_method_not_allowed;

if ($request_method != POST) {
    return 405;
}

if ($mcp_json_content_type = 0) {
    return 415 '{"error":"Content-Type must be application/json"}';
}

if ($http_mcp_protocol_version = "") {
    return 400 $mcp_header_error;
}

if ($mcp_supported_version = 0) {
    return 400 $mcp_unsupported_version_error;
}

if ($mcp_body_method = "") {
    return 400 $mcp_request_error;
}

if ($mcp_body_version != $http_mcp_protocol_version) {
    return 400 $mcp_header_error;
}

if ($http_mcp_method != $mcp_body_method) {
    return 400 $mcp_header_error;
}

if ($mcp_body_method != tools/call) {
    return 404 $mcp_method_error;
}

if ($mcp_body_tool = "") {
    return 400 $mcp_tool_error;
}

if ($http_mcp_name != $mcp_body_tool) {
    return 400 $mcp_header_error;
}

if ($mcp_upstream = "") {
    return 403 '{"error":"Tool denied by edge policy"}';
}
