default_type application/json;
error_page 405 = @mcp_method_not_allowed;
set $mcp_rejection_reason "";

if ($request_method != POST) {
    set $mcp_rejection_reason http_method_not_allowed;
    return 405;
}

if ($mcp_json_content_type = 0) {
    set $mcp_rejection_reason unsupported_media_type;
    return 415 '{"error":"Content-Type must be application/json"}';
}

if ($http_mcp_protocol_version = "") {
    set $mcp_rejection_reason missing_protocol_version;
    return 400 $mcp_header_error;
}

if ($mcp_supported_version = 0) {
    set $mcp_rejection_reason unsupported_protocol_version;
    return 400 $mcp_unsupported_version_error;
}

if ($mcp_body_method = "") {
    set $mcp_rejection_reason invalid_request;
    return 400 $mcp_request_error;
}

if ($mcp_body_version != $http_mcp_protocol_version) {
    set $mcp_rejection_reason protocol_version_mismatch;
    return 400 $mcp_header_error;
}

if ($http_mcp_method != $mcp_body_method) {
    set $mcp_rejection_reason method_header_mismatch;
    return 400 $mcp_header_error;
}

if ($mcp_body_method != tools/call) {
    set $mcp_rejection_reason unsupported_rpc_method;
    return 404 $mcp_method_error;
}

if ($mcp_body_tool = "") {
    set $mcp_rejection_reason missing_tool;
    return 400 $mcp_tool_error;
}

if ($http_mcp_name != $mcp_body_tool) {
    set $mcp_rejection_reason tool_header_mismatch;
    return 400 $mcp_header_error;
}

if ($mcp_upstream = "") {
    set $mcp_rejection_reason tool_denied;
    return 403 '{"error":"Tool denied by edge policy"}';
}
