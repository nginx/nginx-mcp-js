map $http_content_type $mcp_json_content_type {
    default                         0;
    "~*^application/json(\\x20*;|$)" 1;
}

map $http_mcp_protocol_version $mcp_supported_version {
    default     0;
    2026-07-28  1;
}

json_set $mcp_body_method $request_body method;
json_set $mcp_body_tool $request_body params.name;
json_set $mcp_body_version $request_body
    'params._meta["io.modelcontextprotocol/protocolVersion"]';
json_set $mcp_client $request_body
    'params._meta["io.modelcontextprotocol/clientInfo"].name';

# Rejected caller-supplied names must not create metric dimensions.
map $mcp_upstream $mcp_observed_tool {
    ""      "";
    default $mcp_body_tool;
}
