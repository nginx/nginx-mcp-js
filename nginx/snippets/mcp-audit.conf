map $upstream_addr $mcp_audit_upstream_attempted {
    ""      false;
    default true;
}

map $upstream_addr $mcp_audit_decision {
    ""      rejected;
    default forwarded;
}

map $status $mcp_audit_fallback_reason {
    413     body_too_large;
    default not_forwarded;
}

map $mcp_rejection_reason $mcp_audit_rejection {
    ""      $mcp_audit_fallback_reason;
    default $mcp_rejection_reason;
}

map $upstream_addr $mcp_audit_reason {
    ""      $mcp_audit_rejection;
    default "";
}

log_format mcp_audit escape=json
    '{"schema":"nginx.mcp.audit.v1",'
    '"timestamp":"$time_iso8601",'
    '"request_id":"$request_id",'
    '"trace_id":"$otel_trace_id","span_id":"$otel_span_id",'
    '"http":{"method":"$request_method","uri":"$uri",'
        '"status":$status,"request_time":$request_time,'
        '"request_length":$request_length,"bytes_sent":$bytes_sent},'
    '"mcp":{"protocol_version":"$mcp_body_version",'
        '"header_protocol_version":"$http_mcp_protocol_version",'
        '"method":"$mcp_body_method","tool":"$mcp_body_tool",'
        '"header_method":"$http_mcp_method",'
        '"header_tool":"$http_mcp_name","client":"$mcp_client",'
        '"outcome":"$mcp_outcome","rpc_code":"$mcp_rpc_code"},'
    '"gateway":{"decision":"$mcp_audit_decision",'
        '"reason":"$mcp_audit_reason","route":"$mcp_upstream"},'
    '"upstream":{"attempted":$mcp_audit_upstream_attempted,'
        '"address":"$upstream_addr","status":"$upstream_status",'
        '"connect_time":"$upstream_connect_time",'
        '"header_time":"$upstream_header_time",'
        '"response_time":"$upstream_response_time"}}';
